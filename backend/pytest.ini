[pytest]
# DB-HARDEN-2: smoke Postgres THẬT là opt-in. Mặc định `pytest` KHÔNG chạy nó
# (không cần Docker/psycopg2). Chạy riêng: `pytest -m postgres`.
markers =
    real_kdf_cost: chạy với số vòng PBKDF2 THẬT của production (bỏ qua fixture cheap_kdf)
    postgres: smoke tích hợp PostgreSQL thật (opt-in; cần Docker + psycopg2). Chạy: pytest -m postgres
    external_evidence: cần bằng chứng nằm NGOÀI kho (opt-in, NA-05). Đặt ALGOSIM_LIVE_RETRY_EVIDENCE_DIR rồi chạy: pytest -m external_evidence
addopts = -m "not postgres and not external_evidence"
