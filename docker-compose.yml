# AlgoSim — backend FastAPI + PostgreSQL trong Docker.
# Frontend chạy ngoài để giữ hot-reload: cd frontend && npm run dev
#
# Chạy:      docker compose up -d --build
# Dừng:      docker compose down
# Xem log:   docker compose logs -f backend
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: algosim
      POSTGRES_PASSWORD: algosim
      POSTGRES_DB: algosim
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algosim -d algosim"]
      interval: 3s
      timeout: 3s
      retries: 15

  backend:
    build:
      context: ./backend
      args:
        # M17-RC1 §A — truyền danh tính build vào image. `make runtime-doctor`
        # so SHA này với source; lệch = RUNTIME_STALE_IMAGE.
        # Đặt qua env khi build:  GIT_SHA=$(git rev-parse HEAD) docker compose ...
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://algosim:algosim@db:5432/algosim
      # Route sinh ngữ nghĩa: off (mặc định) | shadow | serve.
      # `off` giữ production đúng hành vi cũ; bật là quyết định vận hành TƯỜNG
      # MINH, không phải tác dụng phụ của việc nâng cấp. Xem
      # `app/main.py::semantic_route_mode`.
      #   SEMANTIC_ROUTE_MODE=serve docker compose up -d backend
      SEMANTIC_ROUTE_MODE: ${SEMANTIC_ROUTE_MODE:-off}
      # Telemetry chẩn đoán route ngữ nghĩa — THỤ ĐỘNG, mặc định tắt.
      # Đọc ở `GET /api/diagnostics/semantic`. Bật khi cần biết một lượt chết ở
      # tầng nào; không bật thì mỗi lượt live chỉ trả về "unsupported" trống.
      #   SEMANTIC_TELEMETRY=1 docker compose up -d backend
      SEMANTIC_TELEMETRY: ${SEMANTIC_TELEMETRY:-0}
      # Model Gemini cho MỌI stage. Mặc định giữ nguyên bản đã dùng ở lượt đo
      # #1 — đổi model là quyết định TƯỜNG MINH, và nó đổi cả danh tính hệ được
      # đo (`model_target` trong seal manifest), không chỉ đổi chất lượng.
      # Key hiện tại gọi được: gemini-3.7-flash · 3.6/3.5-flash ·
      # 3.1-pro-preview · 3.1-flash-lite (xem `ListModels`).
      #   GEMINI_MODEL=gemini-3.7-flash docker compose up -d backend
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      # NẠP LẠI KHI SỬA MÃ. Mặc định TẮT — `--reload` là cho máy lập trình.
      #
      # Không bật thì `backend/app` được mount nhưng uvicorn giữ module đã import
      # trong bộ nhớ: sửa mã KHÔNG có tác dụng gì cho tới `docker compose restart
      # backend`, và nó im lặng. Bật thì mọi lần lưu file đều nạp lại — kể cả
      # `skills/*.md`, thứ `gemini.load_skill` cache trong tiến trình.
      #
      # ⚠️ Vẫn còn một tầng nữa mà reload KHÔNG chạm tới: cache exact trong
      # Postgres khoá theo (text đề đã chuẩn hoá + CACHE_VERSION). Cùng một đề
      # gửi lại vẫn trả envelope cũ mà không gọi LLM. Xem `scripts/cache_clear.py`.
      #   DEV_RELOAD=1 docker compose up -d backend
      DEV_RELOAD: ${DEV_RELOAD:-0}
    volumes:
      - ./backend/app:/app/app
      # CHỈ ĐỌC, và chỉ để chạy công cụ vận hành BÊN TRONG mạng compose —
      # `scripts/cache_clear.py` cần `DATABASE_URL` trỏ `db:5432`, mà tên ấy chỉ
      # phân giải được ở trong này. Image KHÔNG copy `scripts/`, nên không mount
      # thì `docker compose exec backend python scripts/…` báo không có file.
      #   docker compose exec backend python scripts/cache_clear.py --liet-ke
      - ./backend/scripts:/app/scripts:ro
    env_file:
      # GEMINI_API_KEY nằm ở đây — tạo từ backend/.env.example
      - path: ./backend/.env
        required: false
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
