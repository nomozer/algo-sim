    let statusTimer = null;
    let fanLeaveTimer = null;
    let captureFeedbackTimer = null;
    let keyboardModality = false;

    function getActiveSensorRatio() {
      if (state.videoRatio && state.videoRatio !== 'auto') return state.videoRatio;
      const ctx = getEffectiveSurface();
      if (ctx.surface === 'fullscreen') {
        const effW = ctx.frameOnDesktop ? ctx.frameW : window.innerWidth;
        const effH = ctx.frameOnDesktop ? ctx.frameH : window.innerHeight;
        return effH >= effW ? '3:4' : '4:3';
      }
      return '4:3';
    }

    function getEffectiveSurface() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;

      if (state.deviceMode === 'mobile') {
        return { surface: 'fullscreen', kind: 'mobile', frameOnDesktop: w > 520, frameW: 390, frameH: Math.min(844, h - 32) };
      }
      if (state.deviceMode === 'tablet') {
        return { surface: 'fullscreen', kind: 'tablet', frameOnDesktop: w > 900, frameW: 768, frameH: Math.min(1024, h - 32) };
      }
      if (state.deviceMode === 'desktop') {
        return { surface: 'dialog', kind: 'desktop', frameOnDesktop: false };
      }

      if (w <= 680 || h <= 560) {
        return { surface: 'fullscreen', kind: 'mobile', frameOnDesktop: false };
      }
      if ((coarse && w <= 1024) || (w <= 820 && h >= 900)) {
        return { surface: 'fullscreen', kind: 'tablet', frameOnDesktop: false };
      }
      return { surface: 'dialog', kind: 'desktop', frameOnDesktop: false };
    }

    /* Compute bounded physical stack & desktop fan-out geometry for 1..5+ photos (§3).
       Shows up to 5 latest cards in the visual deck while preserving true sessionIndex
       and scaling horizontal spread if dialog width is tighter than 576px. */
    function getFanGeometry(shotCount) {
      if (shotCount <= 0) return [];
      const visibleCount = Math.min(shotCount, 5);
      const startIdx = shotCount - visibleCount;
      const dialogW = Math.min(576, Math.max(320, window.innerWidth - 32));
      const spreadScale = Math.max(0.66, Math.min(1, (dialogW - 360) / 216));

      const DESKTOP_STACK = {
        1: [[0, 0, 0, 1]],
        2: [[-5, -2, -6, 0.96], [4, 1, 4, 1]],
        3: [[-7, -2, -8, 0.94], [0, -3, -1, 0.97], [6, 1, 6, 1]],
        4: [[-8, -2, -9, 0.92], [-3, -3, -3, 0.95], [3, -2, 3, 0.98], [7, 1, 7, 1]],
        5: [[-9, -2, -10, 0.90], [-4.5, -3, -5, 0.93], [0, -3.5, 0, 0.96], [4.5, -2, 4.5, 0.98], [8, 1, 8, 1]]
      };

      const DESKTOP_FAN = {
        1: [[0, 0, 0]],
        2: [[-28, -52, -8], [18, -52, 8]],
        3: [[-48, -50, -11], [-8, -58, 0], [32, -50, 11]],
        4: [[-64, -48, -13], [-26, -56, -4.5], [12, -56, 4.5], [50, -48, 13]],
        5: [[-82, -46, -14], [-45, -55, -7], [-8, -60, 0], [29, -55, 7], [66, -46, 14]]
      };

      const MOBILE_STACK = {
        1: [[0, 0, 0, 1]],
        2: [[-4, -2, -6, 0.95], [3, 1, 4, 1]],
        3: [[-6, -2, -8, 0.93], [0, -2.5, -1, 0.97], [5, 1, 5, 1]],
        4: [[-6.5, -2, -9, 0.91], [-2, -3, -3, 0.94], [2.5, -1.5, 2.5, 0.97], [6, 1, 6, 1]],
        5: [[-7, -2, -10, 0.89], [-3.5, -2.8, -5, 0.92], [0, -3.2, 0, 0.95], [3.5, -1.5, 4, 0.98], [6.5, 1, 6.5, 1]]
      };

      const dStack = DESKTOP_STACK[visibleCount];
      const dFan = DESKTOP_FAN[visibleCount];
      const mStack = MOBILE_STACK[visibleCount];

      const items = [];
      for (let k = 0; k < visibleCount; k += 1) {
        const sessionIndex = startIdx + k;
        const photo = state.sessionCaptures[sessionIndex];
        const [sx, sy, srot, sscale] = dStack[k];
        const [fx, fy, frot] = dFan[k];
        const [mx, my, mrot, mscale] = mStack[k];
        items.push({
          slotIndex: k,
          sessionIndex,
          photo,
          zIndex: 2 + k,
          stackX: sx,
          stackY: sy,
          stackRot: srot,
          stackScale: sscale,
          fanX: Math.round(fx * spreadScale * 10) / 10,
          fanY: fy,
          fanRot: Math.round(frot * spreadScale * 10) / 10,
          mobStackX: mx,
          mobStackY: my,
          mobStackRot: mrot,
          mobStackScale: mscale
        });
      }
      return items;
    }

    function showTransientCameraStatus(msg, ms = 1600) {
      state.transientCameraStatus = msg;
      if (statusTimer) clearTimeout(statusTimer);
      statusTimer = setTimeout(() => {
        state.transientCameraStatus = '';
        renderApp();
      }, ms);
    }

    function buildFixtureList(count, ratio) {
      const list = [];
      for (let i = 0; i < count; i += 1) {
        list.push(createFixturePhoto(i, ratio));
      }
      return list;
    }

    /* ==========================================================================
       4. INTERACTIVE PRESETS FOR QUICK INSPECTION (All 20 cases work live too!)
       ========================================================================== */
    function applyPreset(presetNum, fromUrl = false) {
      state.activePreset = presetNum;
      state.lightboxIndex = null;
      state.lightboxScope = 'composer';
      state.lightboxZoom = 1;
      state.lightboxPanX = 0;
      state.lightboxPanY = 0;
      state.sessionDrawerOpen = false;
      state.sessionSelectedIndex = 0;
      state.lastDeletedSessionPhoto = null;
      state.lastDeletedComposerPhoto = null;
      state.closeConfirmOpen = false;
      state.retakeTarget = null;
      state.composerNotice = '';
      state.transientCameraStatus = '';
      state.fanOpen = false;
      state.justCapturedId = null;
      state.justShotPulse = false;

      const realW = window.innerWidth;
      const realH = window.innerHeight;
      const isNativeTouchDevice = (window.matchMedia && window.matchMedia('(pointer: coarse)').matches && realW <= 1024)
        || realW <= 680
        || realH <= 560;

      switch (presetNum) {
        case 1: // Mobile: 0 ảnh (Toàn khung)
          state.deviceMode = isNativeTouchDevice ? 'auto' : 'mobile';
          state.previewFitMode = 'contain';
          state.cameraOpen = true;
          state.cameraErrorKey = null;
          state.sessionCaptures = [];
          break;
        case 2: // Mobile: 1 ảnh
          state.deviceMode = isNativeTouchDevice ? 'auto' : 'mobile';
          state.previewFitMode = 'contain';
          state.cameraOpen = true;
          state.cameraErrorKey = null;
          state.sessionCaptures = buildFixtureList(1, getActiveSensorRatio());
          break;
        case 3: // Mobile: Stack 3 ảnh
          state.deviceMode = isNativeTouchDevice ? 'auto' : 'mobile';
          state.previewFitMode = 'contain';
          state.cameraOpen = true;
          state.cameraErrorKey = null;
          state.sessionCaptures = buildFixtureList(3, getActiveSensorRatio());
          break;
        case 4: // Mobile: Khay xem ảnh (1 chạm mở)
          state.deviceMode = isNativeTouchDevice ? 'auto' : 'mobile';
          state.previewFitMode = 'contain';
          state.cameraOpen = true;
          state.cameraErrorKey = null;
          state.sessionCaptures = buildFixtureList(3, getActiveSensorRatio());
          state.sessionDrawerOpen = true;
          state.sessionSelectedIndex = 1;
          break;
        case 5: // Desktop: 0 ảnh
          state.deviceMode = realW >= 900 ? 'auto' : 'desktop';
          state.previewFitMode = 'contain';
          state.cameraOpen = true;
          state.cameraErrorKey = null;
          state.sessionCaptures = [];
          break;
        case 6: // Desktop: 1 ảnh (Không xòe quạt, không lặp nhãn)
          state.deviceMode = realW >= 900 ? 'auto' : 'desktop';
          state.previewFitMode = 'contain';
          state.cameraOpen = true;
          state.cameraErrorKey = null;
          state.sessionCaptures = buildFixtureList(1, '4:3');
          break;
        case 7: // Desktop: Photo Fan Stack 3 ảnh
          state.deviceMode = realW >= 900 ? 'auto' : 'desktop';
          state.previewFitMode = 'contain';
          state.cameraOpen = true;
          state.cameraErrorKey = null;
          state.sessionCaptures = buildFixtureList(3, '4:3');
          break;
        case 8: // Desktop: Photo Fan Stack 5 ảnh (Hover/Focus xòe quạt)
          state.deviceMode = realW >= 900 ? 'auto' : 'desktop';
          state.previewFitMode = 'contain';
          state.cameraOpen = true;
          state.cameraErrorKey = null;
          state.sessionCaptures = buildFixtureList(5, '4:3');
          break;
        case 9: // Viewer Zoom & Pan (Mở trực tiếp từ Photo Fan Stack)
          state.deviceMode = realW >= 900 ? 'auto' : 'desktop';
          state.previewFitMode = 'contain';
          state.cameraOpen = true;
          state.cameraErrorKey = null;
          state.sessionCaptures = buildFixtureList(5, '4:3');
          state.lightboxScope = 'session';
          state.lightboxIndex = 1;
          state.lightboxZoom = 1.75;
          break;
        case 10: // Xác nhận Đóng khi đã chụp ảnh
          state.deviceMode = 'auto';
          state.previewFitMode = 'contain';
          state.cameraOpen = true;
          state.cameraErrorKey = null;
          state.sessionCaptures = buildFixtureList(2, getActiveSensorRatio());
          state.closeConfirmOpen = true;
          break;
        case 11: // Camera lỗi (5 trạng thái)
          state.deviceMode = 'auto';
          state.cameraOpen = true;
          state.cameraErrorKey = state.cameraErrorKey || 'permission_denied';
          state.sessionCaptures = [];
          break;
        case 12: // Composer: 5 ảnh đính kèm
          state.deviceMode = 'auto';
          state.cameraOpen = false;
          state.cameraErrorKey = null;
          state.composerAttachments = buildFixtureList(5, '4:3');
          break;
      }

      if (!fromUrl) renderApp({ manageFocus: true });
    }

    /* ==========================================================================
       5. CORE CAMERA, PHOTO FAN STACK, VIEWER & CLOSE/DONE INTERACTIONS
       ========================================================================== */
    function openCameraFromComposer() {
      state.cameraOpen = true;
      state.cameraErrorKey = null;
      state.sessionCaptures = [];
      state.sessionDrawerOpen = false;
      state.sessionSelectedIndex = 0;
      state.lastDeletedSessionPhoto = null;
      state.closeConfirmOpen = false;
      state.retakeTarget = null;
      state.fanOpen = false;
      state.composerNotice = '';
      state.transientCameraStatus = '';
      renderApp({ manageFocus: true, focusSelector: '#btn-cam-shutter' });
    }

    function scheduleCaptureFeedbackCleanup() {
      if (captureFeedbackTimer) clearTimeout(captureFeedbackTimer);
      captureFeedbackTimer = setTimeout(() => {
        state.shutterFlash = false;
        state.justShotPulse = false;
        state.justCapturedId = null;
        document.querySelectorAll('.shutter-flash.active').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.just-shot').forEach(el => el.classList.remove('just-shot'));
        document.querySelectorAll('.just-captured').forEach(el => el.classList.remove('just-captured'));
      }, 190);
    }

    // Synchronous, non-blocking shutter (§5): zero modal, zero big toast, instant consecutive capture
    function triggerShutter() {
      if (state.cameraErrorKey || state.closeConfirmOpen) return;

      let nextFixtureIdx = (state.composerAttachments.length + state.sessionCaptures.length) % FIXTURE_SPECS.length;
      if (state.retakeTarget) {
        nextFixtureIdx = state.retakeTarget.index % FIXTURE_SPECS.length;
      }

      // Captures 100% of source frame (videoWidth × videoHeight) regardless of CSS preview mode (§8)
      const captured = createFixturePhoto(nextFixtureIdx, getActiveSensorRatio(), 'camera_photo');
      state.lastDeletedSessionPhoto = null;

      if (state.retakeTarget) {
        const target = state.retakeTarget;
        state.retakeTarget = null;
        if (target.scope === 'composer') {
          state.composerAttachments.splice(target.index, 1, captured);
          state.cameraOpen = false;
          state.lightboxScope = 'composer';
          state.lightboxIndex = target.index;
          state.lightboxZoom = 1;
          state.lightboxPanX = 0;
          state.lightboxPanY = 0;
          renderApp({ manageFocus: true, focusSelector: '#btn-lb-close' });
          return;
        }
        state.sessionCaptures.splice(target.index, 1, captured);
        state.sessionSelectedIndex = target.index;
        state.shutterFlash = true;
        state.justShotPulse = true;
        state.justCapturedId = captured.id;
        state.liveAnnouncement = `Đã chụp thay thế ảnh thứ ${target.index + 1}`;
        renderApp({ manageFocus: true, focusSelector: '#btn-cam-shutter' });
        scheduleCaptureFeedbackCleanup();
        return;
      }

      state.sessionCaptures.push(captured);
      state.sessionSelectedIndex = state.sessionCaptures.length - 1;
      state.shutterFlash = true;
      state.justShotPulse = true;
      state.justCapturedId = captured.id;
      state.liveAnnouncement = `Đã chụp ảnh thứ ${state.sessionCaptures.length}`;
      renderApp();
      scheduleCaptureFeedbackCleanup();
    }

    // Fixed "Xong" (§5, §7): Commit all session photos in order to Composer & close camera
    function commitSessionAndClose() {
      const newCount = state.sessionCaptures.length;
      state.retakeTarget = null;
      state.sessionDrawerOpen = false;
      state.closeConfirmOpen = false;
      state.lastDeletedSessionPhoto = null;
      state.transientCameraStatus = '';
      state.fanOpen = false;
      state.lightboxIndex = null;

      if (newCount > 0) {
        state.composerAttachments = [...state.composerAttachments, ...state.sessionCaptures];
        state.sessionCaptures = [];
      }
      state.composerNotice = '';
      state.lastDeletedComposerPhoto = null;
      state.cameraOpen = false;
      state.cameraErrorKey = null;
      renderApp({ manageFocus: true, focusSelector: '#btn-submit-build' });
    }

    // "Đóng" / Escape (§7):
    // - 0 new session photos => immediate close to Composer (0 confirmation)
    // - >= 1 new session photos => show compact inline choice (Keep / Discard new / Continue)
    function requestCloseCamera() {
      state.fanOpen = false;
      if (state.sessionCaptures.length === 0) {
        state.retakeTarget = null;
        state.sessionDrawerOpen = false;
        state.closeConfirmOpen = false;
        state.lastDeletedSessionPhoto = null;
        state.transientCameraStatus = '';
        state.cameraOpen = false;
        state.cameraErrorKey = null;
        renderApp({ manageFocus: true, focusSelector: '#btn-open-camera' });
        return;
      }
      state.sessionDrawerOpen = false;
      state.transientCameraStatus = '';
      state.closeConfirmOpen = true;
      renderApp({ manageFocus: true, focusSelector: '#btn-confirm-keep' });
    }

    function discardSessionAndClose() {
      state.sessionCaptures = [];
      state.retakeTarget = null;
      state.sessionDrawerOpen = false;
      state.closeConfirmOpen = false;
      state.lastDeletedSessionPhoto = null;
      state.transientCameraStatus = '';
      state.fanOpen = false;
      state.lightboxIndex = null;
      state.cameraOpen = false;
      state.cameraErrorKey = null;
      renderApp({ manageFocus: true, focusSelector: '#btn-open-camera' });
    }

    function openSessionPhotoViewer(idx) {
      if (idx < 0 || idx >= state.sessionCaptures.length) return;
      state.sessionDrawerOpen = false;
      state.closeConfirmOpen = false;
      state.fanOpen = false;
      state.sessionSelectedIndex = idx;
      state.lightboxScope = 'session';
      state.lightboxIndex = idx;
      state.lightboxZoom = 1;
      state.lightboxPanX = 0;
      state.lightboxPanY = 0;
      renderApp({ manageFocus: true, focusSelector: '#btn-zoom-in' });
    }

    function closeLightboxViewer() {
      const scope = state.lightboxScope;
      const prevIdx = state.lightboxIndex || 0;
      state.lightboxIndex = null;
      state.lightboxZoom = 1;
      state.lightboxPanX = 0;
      state.lightboxPanY = 0;

      if (scope === 'session' && state.cameraOpen) {
        const ctx = getEffectiveSurface();
        const minFanSessionIdx = Math.max(0, state.sessionCaptures.length - 5);
        const clampedFanIdx = Math.max(minFanSessionIdx, Math.min(prevIdx, state.sessionCaptures.length - 1));
        const focusTarget = ctx.surface === 'fullscreen'
          ? (state.sessionCaptures.length > 0 ? '#btn-session-stack' : '#btn-cam-shutter')
          : (state.sessionCaptures.length > 0 ? `[data-action="open-session-photo"][data-index="${clampedFanIdx}"]` : '#btn-cam-shutter');
        renderApp({ manageFocus: true, focusSelector: focusTarget });
        return;
      }
      renderApp({ manageFocus: true, focusSelector: `#thumb-open-${prevIdx}` });
    }

    function deleteSelectedSessionPhoto(explicitIdx) {
      const idx = typeof explicitIdx === 'number' ? explicitIdx : state.sessionSelectedIndex;
      if (idx < 0 || idx >= state.sessionCaptures.length) return;
      const [removed] = state.sessionCaptures.splice(idx, 1);
      state.lastDeletedSessionPhoto = { photo: removed, oldIndex: idx };

      if (state.lightboxIndex !== null && state.lightboxScope === 'session') {
        state.lightboxZoom = 1;
        state.lightboxPanX = 0;
        state.lightboxPanY = 0;
        if (state.sessionCaptures.length === 0) {
          state.lightboxIndex = null;
          state.sessionSelectedIndex = 0;
          renderApp({ manageFocus: true, focusSelector: '#btn-undo-live-delete' });
          return;
        }
        state.lightboxIndex = Math.min(idx, state.sessionCaptures.length - 1);
        state.sessionSelectedIndex = state.lightboxIndex;
        renderApp({ manageFocus: true, focusSelector: '#btn-undo-session-delete' });
        return;
      }

      if (state.sessionCaptures.length === 0) {
        state.sessionDrawerOpen = false;
        state.sessionSelectedIndex = 0;
        renderApp({ manageFocus: true, focusSelector: '#btn-undo-live-delete' });
        return;
      }
      if (state.sessionSelectedIndex >= state.sessionCaptures.length) {
        state.sessionSelectedIndex = state.sessionCaptures.length - 1;
      }
      renderApp({ manageFocus: true, focusSelector: '#btn-undo-session-delete' });
    }

    function undoDeleteSessionPhoto() {
      if (!state.lastDeletedSessionPhoto) return;
      const { photo, oldIndex } = state.lastDeletedSessionPhoto;
      const insertAt = Math.min(oldIndex, state.sessionCaptures.length);
      state.sessionCaptures.splice(insertAt, 0, photo);
      state.sessionSelectedIndex = insertAt;
      state.lastDeletedSessionPhoto = null;
      if (state.lightboxIndex !== null && state.lightboxScope === 'session') {
        state.lightboxIndex = insertAt;
        state.lightboxZoom = 1;
        state.lightboxPanX = 0;
        state.lightboxPanY = 0;
      }
      renderApp({ manageFocus: true });
    }

    function startRetakeFromSession(idx) {
      state.lightboxIndex = null;
      state.sessionDrawerOpen = false;
      state.closeConfirmOpen = false;
      state.fanOpen = false;
      state.retakeTarget = { scope: 'session', index: idx };
      state.transientCameraStatus = '';
      renderApp({ manageFocus: true, focusSelector: '#btn-cam-shutter' });
    }

    function startRetakeFromComposer(idx) {
      state.lightboxIndex = null;
      state.cameraOpen = true;
      state.cameraErrorKey = null;
      state.sessionCaptures = [];
      state.sessionDrawerOpen = false;
      state.closeConfirmOpen = false;
      state.fanOpen = false;
      state.retakeTarget = { scope: 'composer', index: idx };
      state.transientCameraStatus = '';
      renderApp({ manageFocus: true, focusSelector: '#btn-cam-shutter' });
    }

    function removeComposerPhoto(idx) {
      if (idx < 0 || idx >= state.composerAttachments.length) return;
      const [removed] = state.composerAttachments.splice(idx, 1);
      state.lastDeletedComposerPhoto = { photo: removed, oldIndex: idx };
      state.composerNotice = `Đã xóa Ảnh #${idx + 1} khỏi ô nhập.`;

      if (state.lightboxIndex !== null && state.lightboxScope === 'composer') {
        state.lightboxZoom = 1;
        state.lightboxPanX = 0;
        state.lightboxPanY = 0;
        if (state.composerAttachments.length === 0) {
          state.lightboxIndex = null;
        } else if (state.lightboxIndex >= state.composerAttachments.length) {
          state.lightboxIndex = state.composerAttachments.length - 1;
        }
      }
      renderApp({ manageFocus: true });
    }

    function undoRemoveComposerPhoto() {
      if (!state.lastDeletedComposerPhoto) return;
      const { photo, oldIndex } = state.lastDeletedComposerPhoto;
      const insertAt = Math.min(oldIndex, state.composerAttachments.length);
      state.composerAttachments.splice(insertAt, 0, photo);
      state.lastDeletedComposerPhoto = null;
      state.composerNotice = '';
      renderApp({ manageFocus: true, focusSelector: `#thumb-open-${insertAt}` });
    }

    function moveComposerPhoto(idx, delta) {
      const next = idx + delta;
      if (next < 0 || next >= state.composerAttachments.length) return;
      const copy = [...state.composerAttachments];
      const [item] = copy.splice(idx, 1);
      copy.splice(next, 0, item);
      state.composerAttachments = copy;
      if (state.lightboxScope === 'composer' && state.lightboxIndex === idx) state.lightboxIndex = next;
      renderApp({
        manageFocus: true,
        focusSelector: delta < 0 ? '#btn-lb-move-prev' : '#btn-lb-move-next'
      });
    }

    function setLightboxZoom(nextZoom) {
      const clamped = Math.max(1, Math.min(3, Math.round(nextZoom * 100) / 100));
      state.lightboxZoom = clamped;
      if (clamped <= 1) {
        state.lightboxPanX = 0;
        state.lightboxPanY = 0;
      } else {
        const maxPan = (clamped - 1) * 320;
        state.lightboxPanX = Math.max(-maxPan, Math.min(maxPan, state.lightboxPanX));
        state.lightboxPanY = Math.max(-maxPan, Math.min(maxPan, state.lightboxPanY));
      }
      const panCanvas = document.getElementById('lightbox-pan-canvas');
      const stageEl = document.getElementById('lightbox-stage');
      const zoomReadout = document.getElementById('btn-zoom-reset');
      if (panCanvas && stageEl) {
        panCanvas.style.transform = `translate3d(${state.lightboxPanX}px, ${state.lightboxPanY}px, 0) scale(${state.lightboxZoom})`;
        stageEl.classList.toggle('is-zoomed', state.lightboxZoom > 1);
        if (zoomReadout) zoomReadout.textContent = `${Math.round(state.lightboxZoom * 100)}%`;
        const outBtn = document.getElementById('btn-zoom-out');
        const inBtn = document.getElementById('btn-zoom-in');
        if (outBtn) outBtn.disabled = state.lightboxZoom <= 1;
        if (inBtn) inBtn.disabled = state.lightboxZoom >= 3;
      } else {
        renderApp();
      }
    }

    function pickFromLibrarySimulatedOrReal(ev) {
      if (ev && ev.shiftKey) {
        const input = document.getElementById('real-file-picker');
        if (input) input.click();
        return;
      }
      const nextIdx = (state.composerAttachments.length + state.sessionCaptures.length) % FIXTURE_SPECS.length;
      const picked = createFixturePhoto(nextIdx, '4:3', 'uploaded_image');
      if (state.sessionCaptures.length > 0) {
        state.composerAttachments = [...state.composerAttachments, ...state.sessionCaptures, picked];
        state.sessionCaptures = [];
      } else {
        state.composerAttachments = [...state.composerAttachments, picked];
      }
      state.cameraOpen = false;
      state.cameraErrorKey = null;
      state.closeConfirmOpen = false;
      state.sessionDrawerOpen = false;
      state.fanOpen = false;
      state.lightboxIndex = null;
      state.composerNotice = '';
      renderApp({ manageFocus: true, focusSelector: '#btn-submit-build' });
    }

    /* ==========================================================================
       7. VIEW RENDERERS
       ========================================================================== */
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function getLiveCameraFeedUrl() {
      const nextIdx = state.retakeTarget
        ? state.retakeTarget.index % FIXTURE_SPECS.length
        : (state.composerAttachments.length + state.sessionCaptures.length) % FIXTURE_SPECS.length;
      return renderWorksheetBundle(nextIdx, getActiveSensorRatio()).fullDataUrl;
    }

    /* Streamlined Master-Detail Mobile Photo Viewer/Tray (§4):
       1-tap open from Mobile Photo Stack · clean thumbnails without big order numbers ·
       prev/next · deep Zoom/Pan jump · Retake · Delete · 1-tap Undo · Return to Camera */
    function renderSessionDrawer() {
      const shotCount = state.sessionCaptures.length;
      if (!state.sessionDrawerOpen || shotCount === 0) return '';

      const selIdx = Math.max(0, Math.min(state.sessionSelectedIndex, shotCount - 1));
      const selected = state.sessionCaptures[selIdx];
      const drawerTitle = shotCount === 1
        ? 'Ảnh đã chụp'
        : `Ảnh thứ ${selIdx + 1} trong ${shotCount} ảnh`;

      return `
        <div id="cam-session-drawer-scrim" class="cam-session-drawer-scrim" data-action="scrim-close-drawer">
          <div id="cam-session-drawer" class="cam-session-drawer" role="region" aria-label="Khay xem ảnh đã chụp">
            <div class="cam-drawer-header">
              <h3 class="cam-drawer-title">${escapeHtml(drawerTitle)}</h3>
              <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
                <button
                  type="button"
                  id="btn-tray-zoom"
                  class="cam-glass-btn"
                  style="min-height:44px;padding:0 12px;"
                  data-action="open-session-photo"
                  data-index="${selIdx}"
                  aria-label="Phóng to để đọc chi tiết công thức"
                >
                  ${ICONS.zoomIn}
                  <span>Phóng to</span>
                </button>
                <button
                  type="button"
                  id="btn-close-drawer"
                  class="cam-glass-btn"
                  style="min-height:44px;padding:0 14px;"
                  data-action="close-session-drawer"
                >Đóng</button>
              </div>
            </div>

            <div class="tray-selected-stage">
              ${shotCount > 1 ? `
                <button
                  type="button"
                  id="btn-tray-prev"
                  class="tray-stage-nav prev"
                  data-action="tray-prev"
                  ${selIdx === 0 ? 'disabled' : ''}
                  aria-label="Xem ảnh trước"
                >${ICONS.chevronLeft}</button>
              ` : ''}
              <img
                id="tray-selected-img"
                src="${selected.fullDataUrl}"
                alt="${escapeHtml(drawerTitle)}: ${escapeHtml(selected.title)}"
              />
              ${shotCount > 1 ? `
                <button
                  type="button"
                  id="btn-tray-next"
                  class="tray-stage-nav next"
                  data-action="tray-next"
                  ${selIdx === shotCount - 1 ? 'disabled' : ''}
                  aria-label="Xem ảnh tiếp theo"
                >${ICONS.chevronRight}</button>
              ` : ''}
            </div>

            ${shotCount > 1 ? `
              <div class="tray-thumb-strip" role="tablist" aria-label="Danh sách ảnh trong phiên">
                ${state.sessionCaptures.map((p, idx) => `
                  <button
                    type="button"
                    id="btn-tray-thumb-${idx}"
                    class="tray-thumb-btn"
                    role="tab"
                    aria-selected="${idx === selIdx}"
                    data-action="select-tray-photo"
                    data-index="${idx}"
                    aria-label="Ảnh thứ ${idx + 1} trong ${shotCount} ảnh: ${escapeHtml(p.title)}"
                  >
                    <img src="${p.thumbUrl}" alt="" />
                  </button>
                `).join('')}
              </div>
            ` : ''}

            ${state.lastDeletedSessionPhoto ? `
              <div class="tray-undo-bar" role="status" aria-live="polite">
                <span>Đã xóa ảnh khỏi phiên chụp</span>
                <button
                  type="button"
                  id="btn-undo-session-delete"
                  class="cam-glass-btn"
                  style="min-height:44px;padding:0 12px;font-size:12px;"
                  data-action="undo-session-delete"
                >Hoàn tác</button>
              </div>
            ` : ''}

            <div class="tray-shared-actions">
              <button
                type="button"
                id="btn-tray-retake"
                class="tray-action-btn"
                data-action="retake-session-photo"
                data-index="${selIdx}"
              >
                ${ICONS.camera}
                <span>Chụp lại</span>
              </button>
              <button
                type="button"
                id="btn-tray-delete"
                class="tray-action-btn danger"
                data-action="delete-session-photo"
                data-index="${selIdx}"
              >
                ${ICONS.trash}
                <span>Xóa ảnh</span>
              </button>
            </div>
          </div>
        </div>
      `;
    }

    /* Compact Inline Close Confirmation on Camera UI (§7 — Zero Nested Modals, Preserves Composer Photos) */
    function renderInlineCloseConfirm() {
      const shotCount = state.sessionCaptures.length;
      if (!state.closeConfirmOpen || shotCount === 0) return '';
      const existingCount = state.composerAttachments.length;
      const subText = existingCount > 0
        ? 'Ảnh đã đính kèm trước đó trong ô nhập vẫn được giữ nguyên.'
        : 'Chọn giữ để đưa ảnh vào ô nhập đề bài, hoặc bỏ ảnh mới chụp trong phiên này.';

      return `
        <div id="cam-close-confirm-scrim" class="cam-close-confirm-scrim" data-action="scrim-cancel-close-confirm">
          <div id="cam-close-confirm" class="cam-close-confirm-card" role="region" aria-labelledby="confirm-close-title">
            <div>
              <h3 id="confirm-close-title" class="confirm-title">Giữ ảnh vừa chụp trước khi đóng?</h3>
              <p class="confirm-desc">${escapeHtml(subText)}</p>
            </div>
            <div class="confirm-actions">
              <button type="button" id="btn-confirm-keep" class="confirm-btn keep" data-action="confirm-keep-photos">
                ${ICONS.check}
                <span>Giữ ảnh</span>
              </button>
              <button type="button" id="btn-confirm-discard" class="confirm-btn discard" data-action="confirm-discard-photos">
                <span>Bỏ ảnh mới</span>
              </button>
              <button type="button" id="btn-confirm-cancel" class="confirm-btn cancel" data-action="cancel-close-confirm">
                <span>Tiếp tục chụp</span>
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function renderMobileFullscreenCamera(backgroundInert = false) {
      if (state.cameraErrorKey) {
        const err = CAMERA_ERRORS[state.cameraErrorKey] || CAMERA_ERRORS.unknown;
        const keptCount = state.sessionCaptures.length;
        return `
          <div class="mobile-error-screen dark-surface" role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="mob-err-title" ${backgroundInert ? 'inert aria-hidden="true"' : ''}>
            <div>
              <button type="button" id="btn-cam-close" class="cam-glass-btn" data-action="close-camera" aria-label="Đóng máy ảnh">
                ${ICONS.close}
                <span>Đóng</span>
              </button>
            </div>

            <div class="mobile-error-card">
              <div class="error-icon-circle" aria-hidden="true">${ICONS.cameraOff}</div>
              <h2 id="mob-err-title" class="mobile-error-title">${escapeHtml(err.title)}</h2>
              <p class="mobile-error-desc">${escapeHtml(err.body)}</p>
              ${keptCount > 0 ? `<p class="mobile-error-desc" style="color:#93c5fd;font-size:12.5px;">Ảnh đã chụp trước đó trong phiên vẫn được giữ an toàn.</p>` : ''}
              <div class="mobile-error-actions">
                <button type="button" id="btn-err-library" class="mobile-error-primary" data-action="pick-library">Chọn ảnh có sẵn</button>
                ${err.canRetry ? `<button type="button" id="btn-err-retry" class="mobile-error-secondary" data-action="retry-camera">Thử lại</button>` : ''}
              </div>
            </div>

            <div style="height:20px;" aria-hidden="true"></div>
            ${renderInlineCloseConfirm()}
          </div>
        `;
      }

      const activeRatio = getActiveSensorRatio();
      const dims = getRatioDimensions(activeRatio);
      const shotCount = state.sessionCaptures.length;
      const fanItems = getFanGeometry(shotCount);
      const fanSpreadScale = Math.round(Math.max(0.66, Math.min(1, (Math.min(576, Math.max(320, window.innerWidth - 32)) - 360) / 216)) * 100) / 100;
      const isContain = state.previewFitMode === 'contain';
      const fitIcon = isContain ? ICONS.fitToggle : ICONS.fitCover;
      const fitAria = isContain
        ? 'Đang xem Toàn khung (không cắt mép đề), nhấn để chuyển sang Tràn màn'
        : 'Đang xem Tràn màn, nhấn để chuyển về Toàn khung';

      let centerTopMarkup = '<span aria-hidden="true"></span>';
      let centerHasPill = false;
      if (state.retakeTarget) {
        centerHasPill = true;
        centerTopMarkup = `
          <button
            type="button"
            id="btn-cancel-retake"
            class="cam-glass-btn"
            style="background:rgba(0,91,171,0.92);border-color:rgba(140,204,255,0.58);"
            data-action="cancel-retake"
            aria-label="Đang chụp lại ảnh thứ ${state.retakeTarget.index + 1}, nhấn để hủy chụp lại"
          >
            <span>Đang chụp lại · Hủy</span>
          </button>
        `;
      } else if (shotCount === 0 && state.lastDeletedSessionPhoto) {
        centerHasPill = true;
        centerTopMarkup = `
          <button
            type="button"
            id="btn-undo-live-delete"
            class="cam-glass-btn"
            data-action="undo-session-delete"
          >
            <span>Đã xóa · Hoàn tác</span>
          </button>
        `;
      } else if (state.transientCameraStatus) {
        centerHasPill = true;
        centerTopMarkup = `
          <div class="cam-status-pill" role="status" aria-live="polite">
            ${escapeHtml(state.transientCameraStatus)}
          </div>
        `;
      }

      const compactTopRight = centerHasPill || shotCount > 0;

      return `
        <div class="camera-fullscreen dark-surface ${!isContain ? 'is-cover-mode' : ''}" role="dialog" tabindex="-1" aria-modal="true" aria-label="Máy ảnh chụp đề bài" ${backgroundInert ? 'inert aria-hidden="true"' : ''}>
          <div class="sr-only" role="status" aria-live="polite">${escapeHtml(state.liveAnnouncement)}</div>

          <!-- Top Bar in dedicated upper dark zone (Minimal: Close + conditional Retake/Undo + Library/Fit/Switch) -->
          <div class="cam-fs-top">
            <button
              type="button"
              id="btn-cam-close"
              class="cam-glass-btn icon-only"
              data-action="close-camera"

      const idx = state.lightboxIndex;

      const photo = list[idx];

        ? (total === 1
          ? `Ảnh đã chụp · ${photo.title}`

      return `

    function measureVisibleSourceFraction() {
      const box = document.getElementById('camera-sensor-box');
      if (!box) return null;
      const rect = box.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      const dims = getRatioDimensions(getActiveSensorRatio());
      const srcAspect = dims.w / dims.h;
      const boxAspect = rect.width / rect.height;
      if (state.previewFitMode === 'contain') {
        return 1.0;
      }
      // Under object-fit: cover, rendered media overflows on the wider axis
      return boxAspect < srcAspect ? (boxAspect / srcAspect) : (srcAspect / boxAspect);
    }

      const visFrac = measureVisibleSourceFraction();

              <select class="proto-select" data-control="cameraCount">
                <option value="2" ${state.cameraCount === 2 ? 'selected' : ''}>2 camera (Hiện nút Đổi)</option>
                <option value="1" ${state.cameraCount === 1 ? 'selected' : ''}>1 camera (Ẩn nút Đổi)</option>
              </select>
            </label>

            <label class="proto-select-row">
              <span>Giả lập lỗi API:</span>
              <select class="proto-select" data-control="cameraErrorKey">
                <option value="" ${!state.cameraErrorKey ? 'selected' : ''}>Không lỗi (Stream hoạt động)</option>
                ${Object.values(CAMERA_ERRORS).map(e => `
                  <option value="${e.code}" ${state.cameraErrorKey === e.code ? 'selected' : ''}>${e.inspectorLabel}</option>
                `).join('')}
              </select>
            </label>
          </div>

          <div class="proto-metric-box">
            <div>• Nguồn giả lập: <strong>${activeRatio} (${dims.w}×${dims.h}px)</strong></div>
            <div>• Tỷ lệ khung nguồn nhìn thấy: <strong>${visText}</strong> (${state.previewFitMode === 'contain' ? 'Toàn khung' : 'Tràn màn'})</div>
            <div>• Hiển thị nhóm ảnh: <strong>Photo Fan Stack + Xong cố định (0 lặp số lượng)</strong></div>
            <div style="color:#93c5fd;">• Tự gọi Gemini khi chụp: <strong>${state.aiCallCount}</strong></div>
            <div style="color:#fcd34d;">• Khóa phạm vi: <strong>Chỉ chốt Camera-First; Header &amp; Composer là ngữ cảnh minh họa</strong></div>
          </div>
        </div>
      `;
    }

    /* ==========================================================================
       8. MASTER RENDER, PHOTO FAN CONTROLLER, POINTER ZOOM/PAN & FOCUS TRAP
       ========================================================================== */
    function renderApp(options = {}) {
      const root = document.getElementById('viewport-root');
      const stage = document.getElementById('axo-stage');
      const ctx = getEffectiveSurface();

      if (ctx.frameOnDesktop) {
        root.classList.add('framed-device-preview');
        stage.style.width = `${ctx.frameW}px`;
        stage.style.height = `${ctx.frameH}px`;
      } else {
        root.classList.remove('framed-device-preview');
        stage.style.width = '100%';
        stage.style.height = '100%';
      }

      const lightboxOpen = state.lightboxIndex !== null;
      const overlayActive = state.cameraOpen || lightboxOpen;

      let html = '';
      if (state.cameraOpen && ctx.surface === 'fullscreen') {
        html = renderMobileFullscreenCamera(lightboxOpen);
        if (lightboxOpen) {
          html += renderReadableLightbox();
        }
      } else {
        html = renderComposerMarkup(overlayActive);
        if (state.cameraOpen && ctx.surface === 'dialog') {
          html += renderDesktopCameraDialog(lightboxOpen);
        }
        if (lightboxOpen) {
          html += renderReadableLightbox();
        }
      }

      stage.innerHTML = html;
      renderInspector();
      bindPhotoFanInteractions();
      bindLightboxPanAndZoom();

      const textarea = document.getElementById('problem-textarea');
      if (textarea) {
        textarea.addEventListener('input', (ev) => {
          state.composerText = ev.target.value;
          const submitBtn = document.getElementById('btn-submit-build');
          if (submitBtn) {
            submitBtn.disabled = !(state.composerAttachments.length > 0 || state.composerText.trim().length > 0);
          }
        });
      }

      if (options.manageFocus) {
        requestAnimationFrame(() => {
          const activeDialog = document.querySelector('.lightbox-card')
            || stage.querySelector('[role="dialog"][aria-modal="true"]:not([inert])');
          if (activeDialog && !keyboardModality && !state.closeConfirmOpen && !options.focusSelector) {
            activeDialog.focus();
            return;
          }
          const preferred = options.focusSelector ? stage.querySelector(options.focusSelector) : null;
          if (preferred && !preferred.disabled) {
            preferred.focus();
            return;
          }
          if (state.lightboxIndex !== null) {
            const lbClose = document.getElementById('btn-lb-close');
            if (lbClose) lbClose.focus();
          } else if (state.closeConfirmOpen) {
            const keepBtn = document.getElementById('btn-confirm-keep');
            if (keepBtn) keepBtn.focus();
          } else if (state.cameraOpen) {
            const primaryCam = document.getElementById('btn-cam-shutter')
              || document.getElementById('btn-err-library')
              || document.getElementById('btn-cam-close');
            if (primaryCam) primaryCam.focus();
          }
        });
      }
    }

    /* Desktop Photo Fan Stack Controller (§3, §9, §13):
       Toggles .is-fan-open directly on the live DOM node (never rebuilding stage.innerHTML)
       so CSS 200ms transform transitions remain silky smooth with zero pointer flicker. */
    function bindPhotoFanInteractions() {
      const fanEl = document.getElementById('photo-fan-stack');
      if (!fanEl) return;
      const fanCapable = fanEl.getAttribute('data-fan-capable') === 'true';

      const setFanOpenDom = (open) => {
        if (!fanCapable) {
          state.fanOpen = false;
          fanEl.classList.remove('is-fan-open');
          return;
        }
        state.fanOpen = open;
        fanEl.classList.toggle('is-fan-open', open);
      };

      fanEl.addEventListener('pointerenter', (ev) => {
        if (ev.pointerType === 'touch') return;
        if (fanLeaveTimer) {
          clearTimeout(fanLeaveTimer);
          fanLeaveTimer = null;
        }
        setFanOpenDom(true);
      });

      fanEl.addEventListener('pointermove', (ev) => {
        if (ev.pointerType === 'touch') return;
        if (fanLeaveTimer) {
          clearTimeout(fanLeaveTimer);
          fanLeaveTimer = null;
        }
        if (fanCapable && !state.fanOpen) {
          setFanOpenDom(true);
        }
      });

      fanEl.addEventListener('pointerleave', (ev) => {
        if (ev.pointerType === 'touch') return;
        if (fanLeaveTimer) clearTimeout(fanLeaveTimer);
        fanLeaveTimer = setTimeout(() => {
          if (!fanEl.matches(':focus-within')) {
            setFanOpenDom(false);
          }
        }, 95);
      });

      fanEl.addEventListener('focusin', () => {
        if (!fanCapable) return;
        if (fanLeaveTimer) {
          clearTimeout(fanLeaveTimer);
          fanLeaveTimer = null;
        }
        setFanOpenDom(true);
      });

      fanEl.addEventListener('focusout', (ev) => {
        if (!fanEl.contains(ev.relatedTarget) && !fanEl.matches(':hover')) {
          setFanOpenDom(false);
        }
      });

      fanEl.addEventListener('keydown', (ev) => {
        if (ev.key !== 'ArrowLeft' && ev.key !== 'ArrowRight') return;
        const cards = Array.from(fanEl.querySelectorAll('.fan-card-btn'));
        if (cards.length <= 1) return;
        const curIdx = cards.indexOf(document.activeElement);
        if (curIdx === -1) return;
        ev.preventDefault();
        setFanOpenDom(true);
        const nextIdx = ev.key === 'ArrowLeft'
          ? Math.max(0, curIdx - 1)
          : Math.min(cards.length - 1, curIdx + 1);
        cards[nextIdx].focus();
      });
    }

    function bindLightboxPanAndZoom() {
      const stageEl = document.getElementById('lightbox-stage');
      const panCanvas = document.getElementById('lightbox-pan-canvas');
      if (!stageEl || !panCanvas) return;

      let dragging = false;
      let startX = 0;
      let startY = 0;
      let originPanX = 0;
      let originPanY = 0;

      stageEl.addEventListener('dblclick', (ev) => {
        if (ev.target.closest('button')) return;
        setLightboxZoom(state.lightboxZoom > 1 ? 1 : 2);
      });

      stageEl.addEventListener('wheel', (ev) => {
        ev.preventDefault();
        const step = ev.deltaY < 0 ? 0.25 : -0.25;
        setLightboxZoom(state.lightboxZoom + step);
      }, { passive: false });

      stageEl.addEventListener('pointerdown', (ev) => {
        if (state.lightboxZoom <= 1 || ev.target.closest('button')) return;
        dragging = true;
        startX = ev.clientX;
        startY = ev.clientY;
        originPanX = state.lightboxPanX;
        originPanY = state.lightboxPanY;
        stageEl.classList.add('is-panning');
        if (stageEl.setPointerCapture) {
          try { stageEl.setPointerCapture(ev.pointerId); } catch (_) {}
        }
      });

      stageEl.addEventListener('pointermove', (ev) => {
        if (!dragging) return;
        const maxPan = (state.lightboxZoom - 1) * 320;
        const nx = Math.max(-maxPan, Math.min(maxPan, originPanX + (ev.clientX - startX)));
        const ny = Math.max(-maxPan, Math.min(maxPan, originPanY + (ev.clientY - startY)));
        state.lightboxPanX = Math.round(nx);
        state.lightboxPanY = Math.round(ny);
        panCanvas.style.transform = `translate3d(${state.lightboxPanX}px, ${state.lightboxPanY}px, 0) scale(${state.lightboxZoom})`;
      });

      const stopDrag = () => {
        if (!dragging) return;
        dragging = false;
        stageEl.classList.remove('is-panning');
      };
      stageEl.addEventListener('pointerup', stopDrag);
      stageEl.addEventListener('pointercancel', stopDrag);
    }

    window.addEventListener('pointerdown', () => { keyboardModality = false; }, true);
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Tab' || e.key === 'Enter' || e.key === ' ' || e.key === 'Escape' || e.key.startsWith('Arrow')) {
        keyboardModality = true;
      }
    }, true);

    /* ==========================================================================
       9. EVENT DELEGATION & MODAL FOCUS TRAP / ESCAPE KEYBOARD NAVIGATION
       ========================================================================== */
    document.addEventListener('click', (ev) => {
      const btn = ev.target.closest('[data-action]');
      if (!btn || btn.disabled) return;
      const action = btn.getAttribute('data-action');
      if (
        (action === 'backdrop-close'
          || action === 'scrim-close-lightbox'
          || action === 'scrim-close-drawer'
          || action === 'scrim-cancel-close-confirm')
        && ev.target !== btn
      ) {
        return;
      }
      const idx = Number(btn.getAttribute('data-index') || 0);

      switch (action) {
        case 'go-home':
          state.composerNotice = '';
          renderApp();
          break;
        case 'open-camera':
          openCameraFromComposer();
          break;
        case 'shutter':
          triggerShutter();
          break;
        case 'done-camera':
          commitSessionAndClose();
          break;
        case 'close-camera':
        case 'backdrop-close':
          requestCloseCamera();
          break;
        case 'confirm-keep-photos':
          commitSessionAndClose();
          break;
        case 'confirm-discard-photos':
          discardSessionAndClose();
          break;
        case 'cancel-close-confirm':
        case 'scrim-cancel-close-confirm':
          state.closeConfirmOpen = false;
          renderApp({ manageFocus: true, focusSelector: '#btn-cam-shutter' });
          break;
        case 'cancel-retake':
          if (state.retakeTarget && state.retakeTarget.scope === 'composer') {
            const retIdx = state.retakeTarget.index;
            state.retakeTarget = null;
            state.cameraOpen = false;
            state.lightboxScope = 'composer';
            state.lightboxIndex = retIdx;
            renderApp({ manageFocus: true, focusSelector: '#btn-lb-close' });
          } else {
            state.retakeTarget = null;
            renderApp({ manageFocus: true, focusSelector: '#btn-cam-shutter' });
          }
          break;
        case 'switch-camera':
          state.facingMode = state.facingMode === 'environment' ? 'user' : 'environment';
          showTransientCameraStatus(state.facingMode === 'environment' ? 'Camera sau' : 'Camera trước', 1300);
          renderApp();
          break;
        case 'toggle-preview-fit':
          state.previewFitMode = state.previewFitMode === 'cover' ? 'contain' : 'cover';
          renderApp();
          break;
        case 'open-session-photo':
          openSessionPhotoViewer(idx);
          break;
        case 'open-session-drawer':
          state.sessionDrawerOpen = true;
          state.closeConfirmOpen = false;
          if (state.sessionSelectedIndex >= state.sessionCaptures.length) {
            state.sessionSelectedIndex = Math.max(0, state.sessionCaptures.length - 1);
          }
          renderApp({ manageFocus: true, focusSelector: '#btn-close-drawer' });
          break;
        case 'close-session-drawer':
        case 'scrim-close-drawer':
          state.sessionDrawerOpen = false;
          renderApp({ manageFocus: true, focusSelector: '#btn-session-stack' });
          break;
        case 'select-tray-photo':
          state.sessionSelectedIndex = idx;
          renderApp({ manageFocus: true, focusSelector: `#btn-tray-thumb-${idx}` });
          break;
        case 'tray-prev':
          if (state.sessionSelectedIndex > 0) {
            state.sessionSelectedIndex -= 1;
            renderApp();
          }
          break;
        case 'tray-next':
          if (state.sessionSelectedIndex < state.sessionCaptures.length - 1) {
            state.sessionSelectedIndex += 1;
            renderApp();
          }
          break;
        case 'delete-session-photo':
          deleteSelectedSessionPhoto(idx);
          break;
        case 'undo-session-delete':
          undoDeleteSessionPhoto();
          break;
        case 'retake-session-photo':
          startRetakeFromSession(idx);
          break;
        case 'pick-library':
          pickFromLibrarySimulatedOrReal(ev);
          break;
        case 'retry-camera':
          state.cameraErrorKey = null;
          showTransientCameraStatus('Đã kết nối lại máy ảnh', 1300);
          renderApp({ manageFocus: true, focusSelector: '#btn-cam-shutter' });
          break;
        case 'open-lightbox':
          state.lightboxScope = 'composer';
          state.lightboxIndex = idx;
          state.lightboxZoom = 1;
          state.lightboxPanX = 0;
          state.lightboxPanY = 0;
          renderApp({ manageFocus: true, focusSelector: '#btn-zoom-in' });
          break;
        case 'close-lightbox':
        case 'scrim-close-lightbox':
          closeLightboxViewer();
          break;
        case 'zoom-in':
          setLightboxZoom(state.lightboxZoom === 1 ? 1.75 : state.lightboxZoom < 2.5 ? 2.5 : 3);
          break;
        case 'zoom-out':
          setLightboxZoom(state.lightboxZoom > 2.5 ? 2.5 : state.lightboxZoom > 1.75 ? 1.75 : 1);
          break;
        case 'zoom-toggle':
          setLightboxZoom(state.lightboxZoom > 1 ? 1 : 1.75);
          break;
        case 'lb-prev':
          if (state.lightboxIndex > 0) {
            state.lightboxIndex -= 1;
            if (state.lightboxScope === 'session') state.sessionSelectedIndex = state.lightboxIndex;
            state.lightboxZoom = 1;
            state.lightboxPanX = 0;
            state.lightboxPanY = 0;
            renderApp();
          }
          break;
        case 'lb-next':
          {
            const activeList = state.lightboxScope === 'session' ? state.sessionCaptures : state.composerAttachments;
            if (state.lightboxIndex < activeList.length - 1) {
              state.lightboxIndex += 1;
              if (state.lightboxScope === 'session') state.sessionSelectedIndex = state.lightboxIndex;
              state.lightboxZoom = 1;
              state.lightboxPanX = 0;
              state.lightboxPanY = 0;
              renderApp();
            }
          }
          break;
        case 'remove-composer-photo':
          removeComposerPhoto(idx);
          break;
        case 'undo-composer-delete':
          undoRemoveComposerPhoto();
          break;
        case 'retake-composer-photo':
          startRetakeFromComposer(idx);
          break;
        case 'move-photo-prev':
          moveComposerPhoto(idx, -1);
          break;
        case 'move-photo-next':
          moveComposerPhoto(idx, 1);
          break;
        case 'dismiss-notice':
          state.composerNotice = '';
          state.lastDeletedComposerPhoto = null;
          renderApp();
          break;
        case 'submit-build':
          state.composerNotice = `Sẵn sàng gửi ${state.composerAttachments.length} ảnh + văn bản tới bước chuẩn bị đề bài (chỉ thực thi khi học sinh bấm Dựng hình).`;
          state.lastDeletedComposerPhoto = null;
          renderApp();
          break;
        case 'fill-sample-1':
          state.composerText = 'Cho hình chóp S.ABCD có đáy ABCD là hình vuông cạnh 2a, SA ⊥ (ABCD) và SA = 2a√3.';
          renderApp();
          break;
        case 'fill-sample-2':
          state.composerText = 'Cho lăng trụ đứng ABC.A\'B\'C\' có đáy ABC vuông tại A, AA\' = 3a. Dựng thiết diện qua A và trung điểm BB\'.';
          renderApp();
          break;
        case 'sample-toast':
          state.composerNotice = 'Prototype này tập trung kiểm chứng luồng Camera-First & Photo Fan Stack.';
          state.lastDeletedComposerPhoto = null;
          renderApp();
          break;
        case 'toggle-inspector':
          state.inspectorExpanded = !state.inspectorExpanded;
          renderInspector();
          break;
        case 'select-preset':
          applyPreset(Number(btn.getAttribute('data-preset')));
          break;
      }
    });

    document.addEventListener('change', (ev) => {
      const ctrl = ev.target.getAttribute('data-control');
      if (!ctrl) return;
      const val = ev.target.value;
      if (ctrl === 'deviceMode') state.deviceMode = val;
      if (ctrl === 'videoRatio') state.videoRatio = val;
      if (ctrl === 'cameraCount') state.cameraCount = Number(val);
      if (ctrl === 'cameraErrorKey') {
        state.cameraErrorKey = val || null;
        if (state.cameraErrorKey) state.cameraOpen = true;
      }
      renderApp({ manageFocus: true });
    });

    // Real file picker support (Shift+Click on Chọn ảnh or OS file selection)
    document.getElementById('real-file-picker').addEventListener('change', (ev) => {
      const files = Array.from(ev.target.files || []);
      if (!files.length) return;
      files.forEach((f, i) => {
        const reader = new FileReader();
        reader.onload = () => {
          const dataUrl = String(reader.result);
          state.composerAttachments.push({
            id: `real-${Date.now()}-${i}`,
            fixtureIndex: 0,
            title: f.name,
            sourceNote: 'Ảnh tải từ thiết bị',
            sourceType: 'uploaded_image',
            fullDataUrl: dataUrl,
            thumbUrl: dataUrl,
            width: 1600,
            height: 1200,
            ratioKey: '4:3'
          });
          state.cameraOpen = false;
          state.cameraErrorKey = null;
          renderApp();
        };
        reader.readAsDataURL(f);
      });
    });

    // Escape dismissal (Viewer -> Close Confirm -> Mobile Tray -> Open Fan -> Camera), Zoomed Keyboard Pan & Modal Focus Trap (WCAG 2.2 AA)
    document.addEventListener('keydown', (ev) => {
      if (ev.key === 'Escape') {
        if (state.lightboxIndex !== null) {
          ev.preventDefault();
          closeLightboxViewer();
          return;
        }
        if (state.closeConfirmOpen) {
          ev.preventDefault();
          state.closeConfirmOpen = false;
          renderApp({ manageFocus: true, focusSelector: '#btn-cam-shutter' });
          return;
        }
        if (state.sessionDrawerOpen) {
          ev.preventDefault();
          state.sessionDrawerOpen = false;
          renderApp({ manageFocus: true, focusSelector: '#btn-session-stack' });
          return;
        }
        const fanEl = document.getElementById('photo-fan-stack');
        if (fanEl && fanEl.classList.contains('is-fan-open')) {
          ev.preventDefault();
          state.fanOpen = false;
          fanEl.classList.remove('is-fan-open');
          const doneBtn = document.getElementById('btn-cam-done');
          if (doneBtn && fanEl.contains(document.activeElement)) {
            doneBtn.focus();
          }
          return;
        }
        if (state.cameraOpen) {
          ev.preventDefault();
          requestCloseCamera();
          return;
        }
      }

      // Keyboard accessible pan when zoomed in Lightbox (WCAG 2.5.7) or prev/next photo at 100% zoom
      if (state.lightboxIndex !== null && state.lightboxZoom === 1 && (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight')) {
        const activeList = state.lightboxScope === 'session' ? state.sessionCaptures : state.composerAttachments;
        if (activeList.length > 1) {
          ev.preventDefault();
          if (ev.key === 'ArrowLeft' && state.lightboxIndex > 0) {
            state.lightboxIndex -= 1;
            if (state.lightboxScope === 'session') state.sessionSelectedIndex = state.lightboxIndex;
            renderApp();
          } else if (ev.key === 'ArrowRight' && state.lightboxIndex < activeList.length - 1) {
            state.lightboxIndex += 1;
            if (state.lightboxScope === 'session') state.sessionSelectedIndex = state.lightboxIndex;
            renderApp();
          }
          return;
        }
      }

      if (state.lightboxIndex !== null && state.lightboxZoom > 1 && ev.key.startsWith('Arrow')) {
        ev.preventDefault();
        const step = 52;
        if (ev.key === 'ArrowLeft') state.lightboxPanX += step;
        if (ev.key === 'ArrowRight') state.lightboxPanX -= step;
        if (ev.key === 'ArrowUp') state.lightboxPanY += step;
        if (ev.key === 'ArrowDown') state.lightboxPanY -= step;
        setLightboxZoom(state.lightboxZoom);
        return;
      }

      if (ev.key === 'Tab') {
        const stage = document.getElementById('axo-stage');
        const subTrap = document.querySelector('.lightbox-card')
          || document.getElementById('cam-close-confirm')
          || document.getElementById('cam-session-drawer')
          || stage.querySelector('[role="dialog"][aria-modal="true"]:not([inert])');
        if (!subTrap) return;

        const focusables = Array.from(
          subTrap.querySelectorAll('button:not(:disabled), [href], input:not(:disabled), select:not(:disabled), textarea:not(:disabled), [tabindex]:not([tabindex="-1"])')
        ).filter(el => el.offsetParent !== null);

        if (focusables.length === 0) return;
        const first = focusables[0];
        const last = focusables[focusables.length - 1];

        if (ev.shiftKey && (document.activeElement === first || !subTrap.contains(document.activeElement))) {
          ev.preventDefault();
          last.focus();
        } else if (!ev.shiftKey && (document.activeElement === last || !subTrap.contains(document.activeElement))) {
          ev.preventDefault();
          first.focus();
        }
      }
    });

    window.addEventListener('resize', () => renderApp());

    // Initialize from optional URL query params (?state=1..12, ?shots=0..7, ?surface=mobile|tablet|desktop, ?fan=1, ?error=..., ?ratio=..., ?cameras=1|2)
    const initialPreset = Number(params.get('state') || 1);
    applyPreset(initialPreset >= 1 && initialPreset <= 12 ? initialPreset : 1, true);

    if (params.get('surface') && ['auto', 'mobile', 'tablet', 'desktop'].includes(params.get('surface'))) {
      state.deviceMode = params.get('surface');
    }
    if (params.has('shots')) {
      const requestedShots = Math.max(0, Math.min(10, Number(params.get('shots') || 0)));
      state.cameraOpen = true;
      state.cameraErrorKey = null;
      state.sessionCaptures = buildFixtureList(requestedShots, getActiveSensorRatio());
      state.sessionSelectedIndex = Math.max(0, requestedShots - 1);
    }
    if (params.get('fan') === '1' && state.sessionCaptures.length > 1) {
      state.fanOpen = true;
    }
    if (params.get('error') && CAMERA_ERRORS[params.get('error')]) {
      state.cameraErrorKey = params.get('error');
      state.cameraOpen = true;
    }
    if (params.get('cameras')) {
      state.cameraCount = Number(params.get('cameras')) === 1 ? 1 : 2;
    }
    renderApp({ manageFocus: true });
  </script>
</body>
</html>
