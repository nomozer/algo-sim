<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 620" width="1040" height="620"
     font-family="Segoe UI, Arial, sans-serif">
  <style>
    .h  { font-size: 13.5px; fill: #6b6c70; letter-spacing: .07em; font-weight: 600; }
    .t  { font-size: 13.5px; fill: #1a1a1a; }
    .tb { font-size: 13.5px; fill: #1a1a1a; font-weight: 600; }
    .ts { font-size: 11.5px; fill: #55565a; }
    .cell { fill: #fff; stroke: #b9bcc2; stroke-width: 1.1; rx: 5; }
    .snap { fill: #e6eff8; stroke: #4a7bb0; stroke-width: 1.1; rx: 5; }
    .frm  { fill: #eaf3ec; stroke: #4a8f63; stroke-width: 1.1; rx: 5; }
    .bij  { stroke: #4a7bb0; stroke-width: 1.4; stroke-dasharray: 4 3; }
    .ar   { stroke: #6b6c70; stroke-width: 1.4; fill: none; marker-end: url(#a); }
    .band { fill: #fafafa; stroke: #e2e3e7; rx: 8; }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#6b6c70"/></marker></defs>

  <text class="h" x="24" y="26">TRỤC NGỮ NGHĨA — INTERPRETER TẤT ĐỊNH SINH VẾT THỰC THI</text>

  <!-- Hàng 1: bước thực thi -->
  <text class="tb" x="24" y="70">Bước thực thi</text>
  <g>
    <rect class="cell" x="196" y="50" width="150" height="34"/><text class="t" x="271" y="72" text-anchor="middle">bước 1</text>
    <rect class="cell" x="356" y="50" width="150" height="34"/><text class="t" x="431" y="72" text-anchor="middle">bước 2</text>
    <rect class="cell" x="516" y="50" width="150" height="34"/><text class="t" x="591" y="72" text-anchor="middle">…</text>
    <rect class="cell" x="676" y="50" width="150" height="34" stroke="#4a7bb0" stroke-width="2"/>
    <text class="tb" x="751" y="72" text-anchor="middle">bước k</text>
    <rect class="cell" x="836" y="50" width="150" height="34"/><text class="t" x="911" y="72" text-anchor="middle">bước n</text>
  </g>
  <path class="ar" d="M346,67 L354,67"/><path class="ar" d="M506,67 L514,67"/>
  <path class="ar" d="M666,67 L674,67"/><path class="ar" d="M826,67 L834,67"/>

  <!-- Hàng 2: memory snapshot -->
  <text class="tb" x="24" y="164">Ảnh chụp bộ nhớ</text>
  <text class="ts" x="24" y="182">đầy đủ, không lưu sai phân</text>
  <g>
    <rect class="snap" x="196" y="140" width="150" height="46"/><text class="t" x="271" y="168" text-anchor="middle">snapshot 1</text>
    <rect class="snap" x="356" y="140" width="150" height="46"/><text class="t" x="431" y="168" text-anchor="middle">snapshot 2</text>
    <rect class="snap" x="516" y="140" width="150" height="46"/><text class="t" x="591" y="168" text-anchor="middle">…</text>
    <rect class="snap" x="676" y="140" width="150" height="46" stroke-width="2.2"/>
    <text class="tb" x="751" y="168" text-anchor="middle">snapshot k</text>
    <rect class="snap" x="836" y="140" width="150" height="46"/><text class="t" x="911" y="168" text-anchor="middle">snapshot n</text>
  </g>
  <g class="bij">
    <line x1="271" y1="84" x2="271" y2="140"/><line x1="431" y1="84" x2="431" y2="140"/>
    <line x1="591" y1="84" x2="591" y2="140"/><line x1="751" y1="84" x2="751" y2="140" stroke-width="2.4"/>
    <line x1="911" y1="84" x2="911" y2="140"/>
  </g>

  <!-- Hàng 3: khung hình -->
  <text class="tb" x="24" y="264">Khung hình</text>
  <text class="ts" x="24" y="282">dẫn xuất, renderer chỉ đọc</text>
  <g>
    <rect class="frm" x="196" y="240" width="150" height="46"/><text class="t" x="271" y="268" text-anchor="middle">khung 1</text>
    <rect class="frm" x="356" y="240" width="150" height="46"/><text class="t" x="431" y="268" text-anchor="middle">khung 2</text>
    <rect class="frm" x="516" y="240" width="150" height="46"/><text class="t" x="591" y="268" text-anchor="middle">…</text>
    <rect class="frm" x="676" y="240" width="150" height="46" stroke-width="2.2"/>
    <text class="tb" x="751" y="268" text-anchor="middle">khung k</text>
    <rect class="frm" x="836" y="240" width="150" height="46"/><text class="t" x="911" y="268" text-anchor="middle">khung n</text>
  </g>
  <g class="bij" stroke="#4a8f63">
    <line x1="271" y1="186" x2="271" y2="240"/><line x1="431" y1="186" x2="431" y2="240"/>
    <line x1="591" y1="186" x2="591" y2="240"/><line x1="751" y1="186" x2="751" y2="240" stroke-width="2.4"/>
    <line x1="911" y1="186" x2="911" y2="240"/>
  </g>

  <!-- Bất biến -->
  <rect x="600" y="304" width="386" height="34" rx="17" fill="#fff" stroke="#4a7bb0" stroke-width="1.6"/>
  <text class="tb" x="793" y="326" text-anchor="middle" fill="#2f5f92">khung k ⇔ bước k — song ánh</text>

  <!-- Tầng trình bày, TÁCH RIÊNG -->
  <rect class="band" x="24" y="366" width="962" height="118"/>
  <text class="h" x="44" y="392">TRỤC TRÌNH BÀY — TẦNG SAU, KHÔNG PHÁ SONG ÁNH TRÊN</text>
  <g>
    <rect class="cell" x="196" y="404" width="230" height="34" fill="#f4f0e6" stroke="#b08f22"/>
    <text class="t" x="311" y="426" text-anchor="middle">bước người học 1  (khung 1–2)</text>
    <rect class="cell" x="436" y="404" width="230" height="34" fill="#f4f0e6" stroke="#b08f22"/>
    <text class="t" x="551" y="426" text-anchor="middle">bước người học 2  (khung 3–5)</text>
    <rect class="cell" x="676" y="404" width="230" height="34" fill="#f4f0e6" stroke="#b08f22"/>
    <text class="t" x="791" y="426" text-anchor="middle">…</text>
  </g>
  <text class="ts" x="196" y="462">Gộp bước là phép PHÂN HOẠCH các khung liên tiếp: đầy đủ, không chồng lấn, không sinh khung mới.</text>

  <!-- Chú thích -->
  <rect class="band" x="24" y="500" width="962" height="98"/>
  <text class="t" x="44" y="528">Renderer được phép nội suy <tspan font-weight="600">pixel</tspan> giữa hai khung để chuyển động mượt, nhưng <tspan font-weight="600">không</tspan> được</text>
  <text class="t" x="44" y="552">bịa trạng thái ngữ nghĩa trung gian. Ranh giới đó giữ cho thao tác “tua tới bước k” có nghĩa xác định.</text>
  <text class="ts" x="44" y="580">Ngân sách trình bày tách khỏi ngân sách thực thi: chạm trần trình bày thì hạ mức chi tiết; chạm trần thực thi thì phải báo.</text>
</svg>
